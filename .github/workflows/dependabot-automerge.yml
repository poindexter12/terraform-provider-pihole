name: Dependabot auto-merge

# Approves Dependabot patch/minor updates and enables auto-merge so they land
# once the required status checks pass. Semver-major updates are left for a
# human to review. The approval satisfies the protect-main ruleset's required
# review; it is re-issued on every push because the ruleset dismisses stale
# approvals when Dependabot rebases.
on:
  pull_request:

permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to enable auto-merge.
      pull-requests: write # Needed to approve the PR.
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Approve and enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          gh pr review "$PR_URL" --approve --body "Auto-approved: Dependabot $UPDATE_TYPE update."
          gh pr merge "$PR_URL" --auto --squash
