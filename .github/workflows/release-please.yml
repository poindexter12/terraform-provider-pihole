name: Release Please

# Maintains a Release PR that bumps the version and updates CHANGELOG.md from
# conventional commits. Merging it tags the release and creates a draft GitHub
# release, then dispatches release.yml to build, sign, and publish it.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the release tag and draft release.
      pull-requests: write # Open and update the Release PR.
      actions: write # Dispatch release.yml for the new tag.
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      # Tags created with GITHUB_TOKEN do not trigger push workflows, so
      # release.yml is started explicitly. workflow_dispatch is exempt from
      # that restriction.
      - name: Dispatch release build
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
